name: Build HACS release package

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    name: Package Halthy integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build HACS release zip
        id: build_package
        run: |
          .github/scripts/build_hacs_package.sh halthy.zip
          echo "package_name=halthy.zip" >> "$GITHUB_OUTPUT"

      - name: Attach package to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.build_package.outputs.package_name }}
          fail_on_unmatched_files: false
