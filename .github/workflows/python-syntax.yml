name: Integration validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Compile custom_components
        run: python -m compileall -q custom_components

      - name: Run integration regression tests
        run: python -m unittest discover custom_components/halthy/tests -p 'test_*.py'

      - name: Validate workout card JavaScript
        run: node --check custom_components/halthy/halthy-workout-card.js
