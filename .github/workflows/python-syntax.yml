name: Integration validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compile custom_components
        run: python -m compileall -q custom_components

      - name: Run integration regression tests
        run: python -m unittest discover custom_components/halthy/tests -p 'test_*.py'

      - name: Validate workout card JavaScript
        run: node --check custom_components/halthy/halthy-workout-card.js
