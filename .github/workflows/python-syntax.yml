name: Integration validation

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile custom_components
        run: python -m compileall -q custom_components

      - name: Run integration regression tests
        run: python custom_components/halthy/tests/test_statistics.py

      - name: Validate workout card JavaScript
        run: node --check custom_components/halthy/halthy-workout-card.js
